[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "patchgauge"
version = "0.2.0a3"
description = "Reversible experiments for test evidence on code changes"
requires-python = ">=3.11"
dependencies = [
    "fastapi~=0.141.0",
    "uvicorn~=0.52.0",
    "httpx~=0.28.0",
    "pydantic~=2.13.0",
    "jsonschema~=4.25.0",
    "pytest~=9.0",
    "coverage~=7.13",
]

[project.scripts]
patchgauge = "patchgauge.check:main"

[tool.setuptools.packages.find]
include = ["patchgauge*"]

[tool.setuptools.package-data]
patchgauge = ["configs/*.json"]
